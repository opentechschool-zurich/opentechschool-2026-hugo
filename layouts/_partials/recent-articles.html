{{ if .Site.Params.homepage.showRecent | default false }}
  <h2 class="mt-8 text-2xl font-extrabold">
    {{ i18n "shortcode.recent_articles" | emojify }}
  </h2>

  {{ range where site.RegularPages "Section" "posts" | first .Site.Params.homepage.recentLimit }}
    {{ partial "article-link.html" . }}
  {{ end }}

{{ end }}
